<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>CatatKu Storage Test</title>
</head>

<body>

<h2>CATATKU STORAGE TEST</h2>

<div id="hasil">
  Sedang mengetes...
</div>


<script>

"use strict";

const hasil =
  document.getElementById("hasil");


/* =====================================================
   TEST INDEXEDDB
   ===================================================== */

let hasilIDB = "";

try {

  if (!window.indexedDB) {

    hasilIDB =
      "❌ IndexedDB TIDAK TERSEDIA";

  }
  else {

    const namaDB =
      "CatatKuTest_" +
      Date.now();

    const request =
      indexedDB.open(
        namaDB,
        1
      );


    request.onupgradeneeded =
      function(event) {

        const database =
          event.target.result;

        if (
          !database.objectStoreNames.contains(
            "test"
          )
        ) {

          database.createObjectStore(
            "test",
            {
              keyPath: "id"
            }
          );

        }

      };


    request.onsuccess =
      function(event) {

        const database =
          event.target.result;

        hasilIDB =
          "✅ IndexedDB BERHASIL";

        database.close();

        tampilkanHasil();

      };


    request.onerror =
      function(event) {

        const error =
          event.target.error;

        hasilIDB =
          "❌ IndexedDB GAGAL<br><br>" +

          "Nama: " +
          (
            error?.name ||
            "Unknown"
          ) +

          "<br><br>" +

          "Pesan: " +
          (
            error?.message ||
            "Tidak ada pesan"
          );

        tampilkanHasil();

      };

  }

}
catch(error) {

  hasilIDB =
    "❌ IndexedDB EXCEPTION<br><br>" +

    error.name +
    "<br><br>" +

    error.message;

}


/* =====================================================
   TEST LOCAL STORAGE
   ===================================================== */

let hasilLS = "";

try {

  const testKey =
    "catatku_storage_test";

  localStorage.setItem(
    testKey,
    "BERHASIL"
  );

  const nilai =
    localStorage.getItem(
      testKey
    );

  if (
    nilai === "BERHASIL"
  ) {

    hasilLS =
      "✅ localStorage BERHASIL";

  }
  else {

    hasilLS =
      "❌ localStorage GAGAL";

  }

}
catch(error) {

  hasilLS =
    "❌ localStorage GAGAL<br><br>" +

    "Nama: " +
    error.name +

    "<br><br>" +

    "Pesan: " +
    error.message;

}


/* =====================================================
   HASIL
   ===================================================== */

function tampilkanHasil() {

  hasil.innerHTML =

    "<h3>HASIL TES</h3>" +

    "<p>" +
    hasilIDB +
    "</p>" +

    "<hr>" +

    "<p>" +
    hasilLS +
    "</p>";

}


/*
 * Jika IndexedDB langsung gagal,
 * tampilkan localStorage sekarang.
 */

setTimeout(
  function() {

    tampilkanHasil();

  },
  1000
);

</script>

</body>

</html>
