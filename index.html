<!-- =====================================================
     CATATKU - RINGKASAN + AKSI CEPAT + MENU LAINNYA
====================================================== -->

<style>

/* =====================================================
   RINGKASAN DATA
====================================================== */

.summary-row {
  width: 100%;
  box-sizing: border-box;

  display: grid;
  grid-template-columns:
    1.2fr 1fr 1fr 1fr;

  gap: 5px;

  background: #ffffff;

  border-radius: 16px;

  padding: 10px 7px;

  margin: 0 0 15px 0;

  box-shadow:
    0 4px 15px rgba(0,0,0,.07);
}

.summary-item {
  min-width: 0;

  text-align: center;

  padding: 3px 2px;

  border-right:
    1px solid #e5e7eb;
}

.summary-item:last-child {
  border-right: none;
}

.summary-item span {
  display: block;

  font-size: 10px;

  line-height: 14px;

  color: #64748b;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.summary-item strong {
  display: block;

  margin-top: 2px;

  font-size: 12px;

  line-height: 17px;

  font-weight: 800;

  color: #0f172a;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =====================================================
   AKSI CEPAT
====================================================== */

.quick-section {
  width: 100%;

  margin: 0 0 15px 0;
}

.section-title {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 11px;
}

.section-title h2 {
  margin: 0;

  font-size: 19px;

  line-height: 24px;

  font-weight: 800;

  color: #0f172a;
}

.section-title p {
  margin: 3px 0 0;

  font-size: 12px;

  line-height: 16px;

  color: #64748b;
}


/* =====================================================
   GRID TOMBOL
====================================================== */

.quick-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 12px;
}


/* =====================================================
   TOMBOL UTAMA
====================================================== */

.quick-card {
  position: relative;

  width: 100%;

  min-height: 128px;

  box-sizing: border-box;

  border: 0;

  border-radius: 19px;

  padding: 17px;

  color: #ffffff;

  text-align: left;

  cursor: pointer;

  display: flex;

  flex-direction: column;

  justify-content: center;

  overflow: hidden;

  box-shadow:
    0 8px 18px rgba(0,0,0,.12);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.quick-card::after {
  content: "";

  position: absolute;

  width: 80px;
  height: 80px;

  right: -25px;
  top: -25px;

  background:
    rgba(255,255,255,.12);

  border-radius: 50%;
}

.quick-card:active {
  transform: scale(.96);

  box-shadow:
    0 4px 10px rgba(0,0,0,.10);
}


/* =====================================================
   IKON
====================================================== */

.quick-icon {
  display: block;

  font-size: 35px;

  line-height: 40px;

  margin-bottom: 7px;
}


/* =====================================================
   NAMA
====================================================== */

.quick-name {
  display: block;

  font-size: 17px;

  line-height: 21px;

  font-weight: 800;

  letter-spacing: .1px;
}


/* =====================================================
   KETERANGAN
====================================================== */

.quick-desc {
  display: block;

  margin-top: 3px;

  font-size: 11px;

  line-height: 15px;

  opacity: .92;
}


/* =====================================================
   WARNA PEMASUKAN
====================================================== */

.quick-card.pemasukan {
  background:
    linear-gradient(
      135deg,
      #15803d,
      #22c55e
    );
}


/* =====================================================
   WARNA PENGELUARAN
====================================================== */

.quick-card.pengeluaran {
  background:
    linear-gradient(
      135deg,
      #dc2626,
      #f43f5e
    );
}


/* =====================================================
   WARNA PENJUALAN
====================================================== */

.quick-card.penjualan {
  background:
    linear-gradient(
      135deg,
      #1d4ed8,
      #3b82f6
    );
}


/* =====================================================
   WARNA BARANG
====================================================== */

.quick-card.barang {
  background:
    linear-gradient(
      135deg,
      #6d28d9,
      #a855f7
    );
}


/* =====================================================
   MENU LAINNYA
====================================================== */

.menu-dropdown {
  width: 100%;

  margin:
    14px 0 90px 0;
}


/* =====================================================
   TOMBOL DROPDOWN
====================================================== */

.dropdown-button {
  width: 100%;

  box-sizing: border-box;

  border: 0;

  background: #ffffff;

  color: #0f172a;

  padding: 15px 16px;

  border-radius: 16px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 4px 15px rgba(0,0,0,.07);

  transition:
    background .15s ease,
    transform .15s ease;
}

.dropdown-button:active {
  transform: scale(.98);

  background: #f8fafc;
}


/* =====================================================
   ISI DROPDOWN
====================================================== */

.dropdown-content {
  display: none;

  width: 100%;

  box-sizing: border-box;

  margin-top: 8px;

  padding: 7px;

  background: #ffffff;

  border-radius: 16px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.08);

  animation:
    menuDown .18s ease;
}

.dropdown-content.show {
  display: block;
}


@keyframes menuDown {

  from {
    opacity: 0;

    transform:
      translateY(-5px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}


/* =====================================================
   ITEM MENU
====================================================== */

.dropdown-content button {
  width: 100%;

  box-sizing: border-box;

  border: 0;

  background: transparent;

  color: #1e293b;

  padding: 13px 12px;

  border-radius: 11px;

  text-align: left;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  display: flex;

  align-items: center;

  gap: 9px;
}

.dropdown-content button:hover {
  background: #f1f5f9;
}

.dropdown-content button:active {
  background: #e2e8f0;

  transform: scale(.99);
}


/* =====================================================
   RESPONSIVE
====================================================== */

@media (max-width: 360px) {

  .quick-grid {
    gap: 9px;
  }

  .quick-card {
    min-height: 115px;

    padding: 14px;

    border-radius: 17px;
  }

  .quick-icon {
    font-size: 31px;

    line-height: 36px;
  }

  .quick-name {
    font-size: 15px;
  }

  .quick-desc {
    font-size: 10px;
  }

  .summary-row {
    padding: 8px 4px;
  }

  .summary-item strong {
    font-size: 11px;
  }

}


/* =====================================================
   TABLET / DESKTOP
====================================================== */

@media (min-width: 600px) {

  .quick-grid {
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
  }

  .quick-card {
    min-height: 145px;
  }

}

</style>

<!-- =====================================================
     JAVASCRIPT MENU DROPDOWN
====================================================== -->

<script>

function toggleMenuLainnya() {

  const menu =
    document.getElementById(
      "menuLainnya"
    );

  const arrow =
    document.getElementById(
      "dropdownArrow"
    );


  if (!menu) {
    return;
  }


  menu.classList.toggle(
    "show"
  );


  if (
    menu.classList.contains(
      "show"
    )
  ) {

    if (arrow) {
      arrow.textContent = "⌃";
    }

  } else {

    if (arrow) {
      arrow.textContent = "⌄";
    }

  }

}


/* =====================================================
   TUTUP DROPDOWN JIKA KLIK DI LUAR
====================================================== */

document.addEventListener(
  "click",
  function(event) {

    const box =
      document.querySelector(
        ".menu-dropdown"
      );

    const menu =
      document.getElementById(
        "menuLainnya"
      );

    const arrow =
      document.getElementById(
        "dropdownArrow"
      );


    if (
      !box ||
      !menu
    ) {
      return;
    }


    if (
      !box.contains(
        event.target
      )
    ) {

      menu.classList.remove(
        "show"
      );

      if (arrow) {
        arrow.textContent = "⌄";
      }

    }

  }
);

</script>
